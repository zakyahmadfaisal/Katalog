<!doctype html>
<html lang="id">
  <head>
    <title>Katalog Citra Satelit</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ===== BRIN COLOR SYSTEM: RED & WHITE ===== */
      :root {
        --brin-red: #cc2929;
        --brin-red-dark: #a31f1f;
        --brin-red-light: #e03535;
        --brin-red-hover: #b82424;
        --brin-red-soft: rgba(204, 41, 41, 0.08);
        --brin-red-medium: rgba(204, 41, 41, 0.15);
        --brin-red-border: rgba(204, 41, 41, 0.25);
        --brin-red-glow: rgba(204, 41, 41, 0.2);

        --white: #ffffff;
        --off-white: #f7f8fa;
        --bg-sidebar: #ffffff;
        --bg-page: #f0f2f5;
        --bg-card: #ffffff;
        --bg-card-hover: #fef5f5;
        --bg-active: #fef0f0;

        --border-light: #e8eaed;
        --border-medium: #d8dadd;
        --border-red: rgba(204, 41, 41, 0.22);

        --text-primary: #1a1d23;
        --text-secondary: #5a6272;
        --text-muted: #8e97a8;
        --text-red: var(--brin-red);

        --sidebar-w: 300px;
        --shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.07);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.1);
        --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.14);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: var(--bg-page);
        overflow: hidden;
        height: 100vh;
        width: 100vw;
      }

      /* ===== SIDEBAR ===== */
      #sidebar {
        position: absolute;
        left: 0;
        top: 0;
        width: var(--sidebar-w);
        height: 100vh;
        background: var(--bg-sidebar);
        border-right: 1px solid var(--border-light);
        z-index: 1000;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 2px 0 12px rgba(0, 0, 0, 0.06);
      }

      /* Red top bar */
      .sidebar-topbar {
        background: var(--brin-red);
        padding: 14px 16px 12px;
        flex-shrink: 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-icon {
        width: 40px;
        height: 40px;
        background: transparent;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .logo-brin {
        width: 60px;
        height: 60px;
      }

      .brand-title {
        font-size: 15px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.3px;
        line-height: 1.1;
      }

      .brand-subtitle {
        font-size: 9.5px;
        color: rgba(255, 255, 255, 0.65);
        font-weight: 500;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        margin-top: 2px;
      }

      /* ===== SEARCH & FILTER AREA ===== */
      .sidebar-controls {
        padding: 14px 14px 10px;
        border-bottom: 1px solid var(--border-light);
        flex-shrink: 0;
        background: #fff;
      }

      /* Search */
      .search-wrap {
        position: relative;
        margin-bottom: 12px;
      }

      .search-wrap input {
        width: 100%;
        padding: 8px 12px 8px 34px;
        background: var(--off-white);
        border: 1px solid var(--border-medium);
        border-radius: 8px;
        color: var(--text-primary);
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 12.5px;
        transition: all 0.2s;
        outline: none;
      }

      .search-wrap input::placeholder {
        color: var(--text-muted);
      }

      .search-wrap input:focus {
        border-color: var(--brin-red);
        background: #fff;
        box-shadow: 0 0 0 3px var(--brin-red-glow);
      }

      .search-icon {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
      }

      /* Filter label */
      .filter-label {
        font-size: 9.5px;
        font-weight: 700;
        color: var(--text-muted);
        letter-spacing: 0.7px;
        text-transform: uppercase;
        margin-bottom: 7px;
      }

      #province-filter,
      #catalog-filter {
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--border-medium);
        background: var(--off-white);
        font-size: 12px;
        margin-bottom: 12px;
        outline: none;
        font-family: "Plus Jakarta Sans", sans-serif;
      }

      #province-filter:focus,
      #catalog-filter:focus {
        border-color: var(--brin-red);
        background: #fff;
      }

      /* Segmented Control */
      #satellite-filter {
        display: flex;
        background: var(--off-white);
        border: 1px solid var(--border-medium);
        border-radius: 9px;
        padding: 3px;
        gap: 2px;
      }

      #satellite-filter button {
        flex: 1;
        padding: 5px 4px;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 11px;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.18s ease;
        white-space: nowrap;
      }

      #satellite-filter button:hover:not(.active-filter) {
        color: var(--brin-red);
        background: var(--brin-red-soft);
      }

      #satellite-filter button.active-filter {
        background: var(--brin-red);
        color: #fff;
        box-shadow: 0 2px 8px var(--brin-red-glow);
      }

      /* ===== COUNT BAR ===== */
      .count-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 9px 14px 7px;
        flex-shrink: 0;
        background: var(--off-white);
        border-bottom: 1px solid var(--border-light);
      }

      .count-label {
        font-size: 9.5px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.6px;
      }

      #count {
        font-size: 10.5px;
        font-weight: 700;
        color: var(--brin-red);
        background: var(--brin-red-soft);
        border: 1px solid var(--brin-red-border);
        padding: 2px 9px;
        border-radius: 20px;
      }

      /* ===== LIST SCROLL ===== */
      #list-wrap {
        flex: 1;
        overflow-y: auto;
        padding: 8px 10px 12px;
        background: var(--off-white);
      }

      #list-wrap::-webkit-scrollbar {
        width: 4px;
      }
      #list-wrap::-webkit-scrollbar-track {
        background: transparent;
      }
      #list-wrap::-webkit-scrollbar-thumb {
        background: #dde0e5;
        border-radius: 4px;
      }
      #list-wrap::-webkit-scrollbar-thumb:hover {
        background: #c5c9d0;
      }

      /* ===== CARD ITEM ===== */
      .item {
        padding: 10px 11px;
        border-radius: 9px;
        cursor: pointer;
        margin-bottom: 5px;
        border: 1px solid var(--border-light);
        background: var(--bg-card);
        transition: all 0.16s ease;
        position: relative;
        box-shadow: var(--shadow-sm);
      }

      .item:hover {
        background: var(--bg-card-hover);
        border-color: var(--brin-red-border);
        box-shadow: 0 2px 10px var(--brin-red-glow);
        transform: translateY(-1px);
      }

      .item.active {
        background: var(--bg-active);
        border-color: var(--brin-red);
        box-shadow: 0 2px 12px var(--brin-red-glow);
      }

      .item.active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 22%;
        bottom: 22%;
        width: 3px;
        background: var(--brin-red);
        border-radius: 0 3px 3px 0;
      }

      .item-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 6px;
        margin-bottom: 5px;
      }

      .layer-name {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-primary);
        word-break: break-word;
        line-height: 1.35;
      }

      /* ===== SATELLITE BADGES ===== */
      .sat-badge {
        flex-shrink: 0;
        font-size: 9.5px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 20px;
        letter-spacing: 0.3px;
        margin-top: 1px;
      }

      .badge-bj {
        background: #f0fdf4;
        color: #166534;
        border: 1px solid #bbf7d0;
      }
      .badge-jl {
        background: #fee2e2;
        color: #b91c1c;
        border: 1px solid #fecaca;
      }
      .badge-sv {
        background: #eff6ff;
        color: #1e40af;
        border: 1px solid #bfdbfe;
      }
      .badge-gf {
        background: #fff7ed;
        color: #c2410c;
        border: 1px solid #fdba74;
      }
      .badge-zy {
        background: #f5f3ff;
        color: #6d28d9;
        border: 1px solid #c4b5fd;
      }
      .badge-other {
        background: #f4f5f7;
        color: #8e97a8;
        border: 1px solid #e0e3e8;
      }

      .item-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .meta-chip {
        font-size: 10px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 3px;
      }

      /* ===== MAP ===== */
      #map {
        position: absolute;
        left: var(--sidebar-w);
        right: 0;
        top: 0;
        bottom: 0;
        height: 100vh;
      }

      /* Leaflet controls */
      .leaflet-control-zoom {
        border: none !important;
        box-shadow: var(--shadow-md) !important;
        border-radius: 10px !important;
        overflow: hidden;
      }

      .leaflet-control-zoom a {
        background: #fff !important;
        color: var(--text-secondary) !important;
        border: none !important;
        border-bottom: 1px solid var(--border-light) !important;
        width: 34px !important;
        height: 34px !important;
        line-height: 34px !important;
        font-size: 16px !important;
        transition: all 0.15s;
      }

      .leaflet-control-zoom a:last-child {
        border-bottom: none !important;
      }

      .leaflet-control-zoom a:hover {
        background: var(--brin-red-soft) !important;
        color: var(--brin-red) !important;
      }

      .leaflet-control-attribution {
        background: rgba(255, 255, 255, 0.85) !important;
        color: var(--text-muted) !important;
        font-size: 9px !important;
        backdrop-filter: blur(4px);
        border-radius: 6px 0 0 0 !important;
      }

      /* ===== SIDE PANEL — White Glassmorphism Drawer ===== */
      #panel {
        position: fixed;
        top: 0;
        right: 0;
        width: 318px;
        height: 100vh;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        border-left: 1px solid var(--border-light);
        z-index: 2000;
        display: none;
        flex-direction: column;
        box-shadow: -8px 0 40px rgba(0, 0, 0, 0.12);
        transform: translateX(100%);
        transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      }

      #panel.open {
        display: flex;
        transform: translateX(0);
      }

      /* Red top bar on panel */
      .panel-topbar {
        background: var(--brin-red);
        padding: 13px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .panel-header-title {
        font-size: 10.5px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.85);
        text-transform: uppercase;
        letter-spacing: 0.7px;
      }

      .close-btn {
        width: 26px;
        height: 26px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
      }

      .close-btn:hover {
        background: rgba(255, 255, 255, 0.25);
        border-color: rgba(255, 255, 255, 0.45);
      }

      #panel-content {
        flex: 1;
        overflow-y: auto;
      }

      #panel-content::-webkit-scrollbar {
        width: 4px;
      }
      #panel-content::-webkit-scrollbar-thumb {
        background: #e0e3e8;
        border-radius: 4px;
      }

      .panel-title {
        font-size: 13px;
        font-weight: 700;
        color: var(--text-primary);
        word-break: break-word;
        line-height: 1.4;
        padding: 14px 16px 3px;
      }

      .panel-subtitle {
        font-size: 11px;
        color: var(--text-muted);
        padding: 0 16px 12px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .panel-subtitle .dot {
        width: 3px;
        height: 3px;
        background: #ccc;
        border-radius: 50%;
      }

      .img-preview {
        width: 100%;
        height: 144px;
        object-fit: cover;
        display: block;
      }

      .img-preview-wrap {
        position: relative;
        border-top: 1px solid var(--border-light);
        border-bottom: 1px solid var(--border-light);
        background: var(--off-white);
        min-height: 60px;
      }

      /* FIX #8 — fallback placeholder saat gambar gagal load */
      .img-no-preview {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 80px;
        color: var(--text-muted);
        font-size: 11px;
        gap: 6px;
        border-top: 1px solid var(--border-light);
        border-bottom: 1px solid var(--border-light);
        background: var(--off-white);
      }

      .img-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 48px;
        background: linear-gradient(
          to bottom,
          transparent,
          rgba(255, 255, 255, 0.7)
        );
      }

      /* Stat grid */
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        padding: 12px 16px 8px;
      }

      .stat-card {
        background: var(--off-white);
        border: 1px solid var(--border-light);
        border-radius: 8px;
        padding: 9px 10px;
      }

      .stat-card.highlight {
        background: var(--brin-red-soft);
        border-color: var(--brin-red-border);
      }

      .stat-value {
        font-size: 13.5px;
        font-weight: 800;
        color: var(--text-primary);
        font-family: "DM Mono", monospace;
        letter-spacing: -0.5px;
      }

      .stat-card.highlight .stat-value {
        color: var(--brin-red);
      }

      .stat-key {
        font-size: 9px;
        color: var(--text-muted);
        margin-top: 2px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }

      /* Section */
      .section {
        padding: 10px 16px 4px;
      }

      .section-label {
        font-size: 9.5px;
        font-weight: 700;
        color: var(--brin-red);
        text-transform: uppercase;
        letter-spacing: 0.7px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .section-label::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border-light);
      }

      /* Metadata Table */
      .meta-table {
        width: 100%;
        border-collapse: collapse;
      }

      .meta-table tr {
        border-bottom: 1px solid #f0f2f5;
      }
      .meta-table tr:last-child {
        border-bottom: none;
      }

      .meta-table td {
        padding: 6px 0;
        vertical-align: top;
        font-size: 11.5px;
        line-height: 1.4;
      }

      .meta-table td:first-child {
        color: var(--text-muted);
        width: 40%;
        font-weight: 500;
        padding-right: 8px;
      }

      .meta-table td:last-child {
        color: var(--text-primary);
        font-family: "DM Mono", monospace;
        font-size: 10.5px;
        font-weight: 500;
      }

      /* Loading spinner — red */
      .loading-spinner {
        display: inline-block;
        width: 10px;
        height: 10px;
        border: 1.5px solid var(--brin-red-border);
        border-top-color: var(--brin-red);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Empty state */
      .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: var(--text-muted);
      }
      .empty-state svg {
        margin: 0 auto 10px;
        opacity: 0.3;
        display: block;
      }
      .empty-state p {
        font-size: 12px;
      }

      .panel-bottom-pad {
        height: 24px;
      }
      .skeleton {
        background: linear-gradient(90deg, #eee, #f5f5f5, #eee);
        background-size: 400px 100%;
        animation: shimmer 1.2s infinite;
        border-radius: 8px;
        height: 50px;
        margin-bottom: 6px;
      }

      @keyframes shimmer {
        0% {
          background-position: -400px 0;
        }
        100% {
          background-position: 400px 0;
        }
      }
    </style>
  </head>
  <body>
    <!-- ===== SIDEBAR ===== -->
    <div id="sidebar">
      <!-- Red Top Bar with BRIN Brand -->
      <div class="sidebar-topbar">
        <div class="brand">
          <div class="brand-icon">
            <img src="http://localhost/quicklook/brin.png" class="logo-brin" />
          </div>
          <div>
            <div class="brand-title">Katalog Citra Satelit</div>
            <div class="brand-subtitle">Badan Riset dan Inovasi Nasional</div>
          </div>
        </div>
      </div>

      <!-- Search & Filter -->
      <div class="sidebar-controls">
        <div class="search-wrap">
          <span class="search-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3" />
            </svg>
          </span>
          <input type="text" id="search" placeholder="Cari nama layer..." />
        </div>
        <div class="filter-label">Catalog Source</div>

        <select id="catalog-filter">
          <option value="STARVISION">StarVision</option>
          <option value="LASAC">LASAC</option>
        </select>
        <div class="filter-label">Area of Interest</div>

        <select id="province-filter">
          <option value="ALL">Semua Provinsi</option>
        </select>

        <div class="filter-label">Filter Satelit</div>
        <div id="satellite-filter">
          <button onclick="setSatellite('ALL', this)">ALL</button>
          <button onclick="setSatellite('BJ', this)">Beijing</button>
          <button onclick="setSatellite('JL', this)">Jilin</button>
          <button onclick="setSatellite('SV', this)">SuperView</button>
          <button onclick="setSatellite('GF', this)">Gaofen</button>
          <button onclick="setSatellite('ZY', this)">Ziyuan</button>
        </div>
      </div>

      <!-- Count bar -->
      <div class="count-bar">
        <span class="count-label">Data Ditemukan</span>
        <span id="count">—</span>
      </div>

      <!-- List -->
      <div id="list-wrap">
        <div id="list"></div>
        <div
          id="scroll-loading"
          style="
            text-align: center;
            padding: 10px;
            display: none;
            font-size: 11px;
            color: #999;
          "
        >
          Memuat data...
        </div>
      </div>
    </div>

    <!-- ===== SIDE PANEL ===== -->
    <div id="panel">
      <div class="panel-topbar">
        <span class="panel-header-title">Detail Citra</span>
        <button class="close-btn" onclick="hidePanel()">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </div>
      <div id="panel-content"></div>
    </div>

    <!-- ===== MAP ===== -->
    <div id="map">
      <div
        id="map-loading"
        style="
          position: absolute;
          top: 10px;
          right: 10px;
          background: white;
          padding: 6px 10px;
          border-radius: 6px;
          font-size: 11px;
          display: none;
          box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
          z-index: 999;
        "
      >
        Loading map...
      </div>
    </div>

    <script>
      /* ========================= STATE ========================= */
      const STATE = {
        keyword: "",
        cache: new Map(),
        lastBBoxKey: "",
        lastFilterKey: "",
        satellite: "ALL",
        catalog: "STARVISION",
        province: "ALL",
        listOffset: 0,
        limit: 50,
        isLoading: false,
        hasMore: true,
        selectedLayer: null,
        // FIX #4 — track selected feature ID untuk guard double-click
        selectedFeatureId: null,
        mapRequestId: 0,
        listRequestId: 0,
        loadedIds: new Set(),
        isSelectingFeature: false,
        useBBoxFilter: false,
      };

      let mapController = null;
      let listController = null;
      let pendingUserAction = false;

      /* ========================= getFilterKey ========================= */
      function getFilterKey() {
        return `${STATE.catalog}|${STATE.satellite}|${STATE.keyword}|${STATE.province}`;
      }

      /* ========================= BBOX MODE ========================= */
      function shouldUseBBoxFilter() {
        return map.getZoom() >= 6;
      }

      /* ========================= CONFIG ========================= */
      const CONFIG = {
        apiBase: "http://localhost:3000/api",
      };

      /* ========================= API ========================= */
      function fetchJSON(params, type = "map") {
        let url;

        if (type === "map") {
          if (mapController) mapController.abort();
          mapController = new AbortController();

          const bboxParam = params.bbox ? `&bbox=${params.bbox}` : "";
          url =
            `${CONFIG.apiBase}/catalog/map?zoom=${map.getZoom()}` +
            bboxParam +
            `&keyword=${encodeURIComponent(STATE.keyword)}` +
            `&satellite=${encodeURIComponent(STATE.satellite)}` +
            `&province=${encodeURIComponent(STATE.province)}` +
            `&catalog=${encodeURIComponent(STATE.catalog)}`;
        } else {
          if (listController) listController.abort();
          listController = new AbortController();

          let page = Math.floor(STATE.listOffset / STATE.limit);
          let bboxQuery = "";

          if (STATE.useBBoxFilter && params?.bbox) {
            bboxQuery = `&bbox=${params.bbox}`;
          }

          url =
            `${CONFIG.apiBase}/catalog?` +
            `keyword=${encodeURIComponent(STATE.keyword)}` +
            `&satellite=${encodeURIComponent(STATE.satellite)}` +
            `&province=${encodeURIComponent(STATE.province)}` +
            `&catalog=${encodeURIComponent(STATE.catalog)}` +
            `&page=${page}` +
            `&limit=${STATE.limit}` +
            bboxQuery;
        }

        const signal =
          type === "map" ? mapController.signal : listController.signal;

        return fetch(url, { signal })
          .then((r) => {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .catch((err) => {
            if (err.name === "AbortError") return null;
            console.error(`${type.toUpperCase()} ERROR:`, url, err);
            document.getElementById("count").innerText = "Server error";
            return null;
          });
      }

      /* ========================= LOAD PROVINCE ========================= */
      async function loadProvinceList() {
        try {
          const res = await fetch(`${CONFIG.apiBase}/provinces`);
          const data = await res.json();
          const select = document.getElementById("province-filter");
          select.innerHTML = `<option value="ALL">Semua Provinsi</option>`;
          data.forEach((p) => {
            const opt = document.createElement("option");
            opt.value = p.provinsi;
            opt.textContent = p.provinsi;
            select.appendChild(opt);
          });
        } catch (err) {
          console.error("Province load error:", err);
        }
      }

      /* ========================= MAP ========================= */
      let map = L.map("map", { zoomControl: false }).setView([-2, 118], 5);
      map.createPane("quicklookPane");
      map.createPane("interactionPane");

      map.getPane("quicklookPane").style.zIndex = 699;
      map.getPane("interactionPane").style.zIndex = 650;

      let geoLayer,
        layerMap = {},
        activeOverlay = null,
        wmsLayer;

      L.control.zoom({ position: "bottomright" }).addTo(map);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors",
        maxZoom: 19,
      }).addTo(map);

      wmsLayer = buildWMSLayer();
      if (wmsLayer) {
        wmsLayer.addTo(map);
      }

      function renderMap(features) {
        if (!geoLayer) {
          geoLayer = L.geoJSON(null, {
            pane: "interactionPane",
            style: () => ({
              color: "#222222",
              weight: 1,
              opacity: 0.9,
              fillColor: "#8f8f8f",
              fillOpacity: 0.12,
              interactive: true,
            }),
            onEachFeature: (f, layer) => {
              let id = f.properties.gid;
              if (!id) return;
              layerMap[id] = layer;
              layer.on("click", (e) => {
                L.DomEvent.stopPropagation(e);
                selectFeature(f, layer);
              });
              layer.on("mouseover", () => {
                if (layer !== STATE.selectedLayer) {
                  layer.setStyle({
                    color: "#000000",
                    weight: 2,
                    opacity: 1,
                    fillColor: "#a0a0a0",
                    fillOpacity: 0.08,
                  });
                }
              });
              layer.on("mouseout", () => {
                if (layer !== STATE.selectedLayer) {
                  geoLayer.resetStyle(layer);
                }
              });
            },
          }).addTo(map);
        } else {
          geoLayer.clearLayers();
        }

        layerMap = {};
        geoLayer.addData(features);
        geoLayer.bringToFront();
      }

      /* ========================= QUICKLOOK OVERLAY ========================= */
      function showQuicklookOverlay(feature, layer) {
        if (!feature?.properties?.quicklook) return;

        if (activeOverlay) {
          map.removeLayer(activeOverlay);
          activeOverlay = null;
        }

        const bounds = layer.getBounds();
        const paddedBounds = bounds.pad(0.05);

        activeOverlay = L.imageOverlay(
          feature.properties.quicklook,
          paddedBounds,
          {
            pane: "quicklookPane",
            opacity: 0.9,
            interactive: false,
            crossOrigin: true,
          },
        );

        activeOverlay.addTo(map);
        map.getPane("quicklookPane").style.zIndex = 699;
        map.getPane("interactionPane").style.zIndex = 650;

        activeOverlay.on("error", () => {
          console.warn("Overlay gagal load:", feature.properties.quicklook);
        });
      }

      /* ========================= BADGE ========================= */
      function getSatBadge(layerName, satellite) {
        const sat = (satellite || "").toLowerCase();
        if (sat.startsWith("bj")) return { cls: "badge-bj", label: "BJ" };
        if (sat.startsWith("jl")) return { cls: "badge-jl", label: "JL" };
        if (sat.startsWith("sv")) return { cls: "badge-sv", label: "SV" };
        if (sat.startsWith("gf")) return { cls: "badge-gf", label: "GF" };
        if (sat.startsWith("zy")) return { cls: "badge-zy", label: "ZY" };
        return { cls: "badge-other", label: satellite || "—" };
      }

      /* ========================= UI ========================= */
      function buildList(features, reset = false) {
        let el = document.getElementById("list");
        if (reset) {
          el.innerHTML = "";
          STATE.loadedIds.clear();
        }
        if (features.length === 0 && reset) {
          el.innerHTML = `<div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <p>Tidak ada data ditemukan</p></div>`;
          return;
        }
        features.forEach((f) => {
          let id = f.properties.gid;
          if (STATE.loadedIds.has(id)) return;
          STATE.loadedIds.add(id);
          let p = f.properties;
          let badge = getSatBadge(p.layer_name || "", p.satellite || "");
          let div = document.createElement("div");
          div.className = "item";
          div.dataset.id = id;
          div.innerHTML = `
            <div class="item-top">
              <div class="layer-name">${highlightText(p.layer_name)}</div>
              <span class="sat-badge ${badge.cls}">${badge.label}</span>
            </div>
            <div class="item-meta">
              <span class="meta-chip">
                <svg xmlns="http://www.w3.org/2000/svg" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                ${formatDate(p.acquisition_date)}
              </span>
              ${
                p.cloud_cover !== undefined && p.cloud_cover !== null
                  ? `<span class="meta-chip">
                <svg xmlns="http://www.w3.org/2000/svg" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
                ${formatCloud(p.cloud_cover)}</span>`
                  : ""
              }
              ${p.gsd ? `<span class="meta-chip">${p.gsd}m GSD</span>` : ""}
            </div>`;
          div.onclick = () => {
            document
              .querySelectorAll(".item")
              .forEach((e) => e.classList.remove("active"));
            div.classList.add("active");
            zoomToFeatureAndSelect(f, id);
          };
          el.appendChild(div);
        });
      }

      function showPanel(html) {
        const panel = document.getElementById("panel");
        document.getElementById("panel-content").innerHTML = html;
        panel.style.display = "flex";
        requestAnimationFrame(() => panel.classList.add("open"));
      }

      function hidePanel() {
        const panel = document.getElementById("panel");
        panel.classList.remove("open");
        setTimeout(() => {
          panel.style.display = "none";
        }, 320);
        if (activeOverlay) {
          map.removeLayer(activeOverlay);
          activeOverlay = null;
        }
        if (STATE.selectedLayer && geoLayer) {
          geoLayer.resetStyle(STATE.selectedLayer);
          STATE.selectedLayer = null;
        }
        // FIX #4 — reset selectedFeatureId saat panel ditutup
        STATE.selectedFeatureId = null;
        document
          .querySelectorAll(".item")
          .forEach((el) => el.classList.remove("active"));
      }

      /* ========================= FEATURE ========================= */
      async function zoomToFeatureAndSelect(f, id) {
        // FIX #4 — guard double-click pada fitur yang sama
        if (STATE.selectedFeatureId === id && STATE.isSelectingFeature) return;

        try {
          if (layerMap[id]) {
            selectFeature(f, layerMap[id]);
            return;
          }

          STATE.isSelectingFeature = true;
          STATE.selectedFeatureId = id;

          const res = await fetch(
            `${CONFIG.apiBase}/catalog/${id}?catalog=${encodeURIComponent(STATE.catalog)}`,
          );

          if (!res.ok) throw new Error("Feature gagal diambil");

          const feature = await res.json();

          if (!feature?.geometry) throw new Error("Geometry kosong");

          renderMap([feature]);

          requestAnimationFrame(() => {
            const targetLayer = layerMap[id];
            if (!targetLayer) {
              console.warn("Layer tetap tidak ditemukan");
              STATE.isSelectingFeature = false;
              return;
            }
            selectFeature(feature, targetLayer);
          });
        } catch (err) {
          console.error("zoomToFeatureAndSelect ERROR:", err);
          STATE.isSelectingFeature = false;
          STATE.selectedFeatureId = null;
        }
      }

      function getId(f) {
        return f.properties.gid;
      }

      function selectFeature(f, layer) {
        if (!layer) return;

        STATE.isSelectingFeature = true;
        STATE.selectedFeatureId = getId(f);

        if (STATE.selectedLayer && geoLayer) {
          geoLayer.resetStyle(STATE.selectedLayer);
        }

        highlightList(getId(f));
        STATE.selectedLayer = layer;

        layer.setStyle({
          color: "#111111",
          weight: 3,
          opacity: 1,
          fillColor: "#b0b0b0",
          fillOpacity: 0.04,
          dashArray: null,
        });

        layer.bringToBack();

        const bounds = layer.getBounds();
        const paddedBounds = bounds.pad(0.35);

        let p = f.properties;

        function row(label, value) {
          if (value === null || value === undefined || value === "nan")
            value = "—";
          return `<tr><td>${escapeHTML(String(label))}</td><td>${escapeHTML(String(value))}</td></tr>`;
        }

        // FIX #8 — quicklook dengan fallback placeholder yang lebih baik
        const quicklookHTML = p.quicklook
          ? `<div class="img-preview-wrap">
               <img
                 class="img-preview"
                 src="${escapeHTML(p.quicklook)}"
                 loading="lazy"
                 onerror="this.parentElement.outerHTML='<div class=\\'img-no-preview\\'><svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'16\\' height=\\'16\\' viewBox=\\'0 0 24 24\\' fill=\\'none\\' stroke=\\'currentColor\\' stroke-width=\\'2\\'><rect x=\\'3\\' y=\\'3\\' width=\\'18\\' height=\\'18\\' rx=\\'2\\'/><circle cx=\\'8.5\\' cy=\\'8.5\\' r=\\'1.5\\'/><polyline points=\\'21 15 16 10 5 21\\'/></svg>Quicklook tidak tersedia</div>'"
               />
               <div class="img-overlay"></div>
             </div>`
          : `<div class="img-no-preview">
               <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
               Quicklook tidak tersedia
             </div>`;

        // FIX #11 — periode dengan title tooltip untuk nilai penuh
        const periodeShort =
          formatDate(p.acquisition_date) !== "—"
            ? formatDate(p.acquisition_date).slice(0, 7)
            : "—";
        const periodeFull = formatDate(p.acquisition_date);

        let html = `
    <div class="panel-title">${escapeHTML(p.layer_name || "")}</div>
    <div class="panel-subtitle">
      <span>${escapeHTML(p.satellite || "—")}</span>
      <span class="dot"></span>
      <span>${escapeHTML(p.sensor || "—")}</span>
    </div>

    ${quicklookHTML}

    <div class="stat-grid">
      <div class="stat-card highlight">
        <div class="stat-value">${formatCloud(p.cloud_cover)}</div>
        <div class="stat-key">Cloud</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${p.gsd ? p.gsd + "m" : "—"}</div>
        <div class="stat-key">GSD</div>
      </div>
      <div class="stat-card" title="${periodeFull}">
        <div class="stat-value">${periodeShort}</div>
        <div class="stat-key">Periode</div>
      </div>
    </div>

    <div class="section">
      <div class="section-label">Info Utama</div>
      <table class="meta-table">
        ${row("Tanggal Akuisisi", formatDate(p.acquisition_date))}
        ${row("Cloud Cover", formatCloud(p.cloud_cover))}
        ${row("GSD", p.gsd != null ? p.gsd + " m" : "—")}
      </table>
    </div>

    <div class="section">
      <div class="section-label">Koordinat</div>
      <table class="meta-table">
        ${row("Longitude", p.lon_ctr != null ? Number(p.lon_ctr).toFixed(6) : "—")}
        ${row("Latitude", p.lat_ctr != null ? Number(p.lat_ctr).toFixed(6) : "—")}
      </table>
    </div>

    <div class="panel-bottom-pad"></div>
  `;

        showPanel(html);

        map.fitBounds(paddedBounds, {
          paddingTopLeft: [40, 40],
          paddingBottomRight: [360, 40],
          maxZoom: 9,
          animate: true,
          duration: 0.8,
        });

        // FIX #4 — gunakan once agar listener tidak menumpuk
        map.once("moveend", () => {
          showQuicklookOverlay(f, layer);
          setTimeout(() => {
            STATE.isSelectingFeature = false;
          }, 300);
        });
      }

      /* ========================= LOAD DATA ========================= */
      function loadData() {
        if (STATE.isLoading) return;

        STATE.isLoading = true;
        document.getElementById("count").innerHTML =
          `<span class="loading-spinner"></span>`;

        let requestId = ++STATE.mapRequestId;
        STATE.limit = getDynamicLimit();

        STATE.listOffset = 0;
        STATE.hasMore = true;
        STATE.loadedIds.clear();

        STATE.useBBoxFilter = shouldUseBBoxFilter();

        let bbox = null;
        if (STATE.useBBoxFilter) {
          let b = map.getBounds();
          bbox = `${b.getWest()},${b.getSouth()},${b.getEast()},${b.getNorth()}`;
        }

        let bboxKey = bbox ? getBBoxKey(bbox) : "GLOBAL";
        let filterKey = getFilterKey();
        let cacheKey = `${bboxKey}|${filterKey}`;

        if (STATE.cache.has(cacheKey)) {
          let cached = STATE.cache.get(cacheKey);
          renderMap(cached.map || []);
          buildList(cached.list || [], true);
          STATE.listOffset = (cached.list || []).length;
          STATE.hasMore = STATE.listOffset >= STATE.limit;
          document.getElementById("count").innerText =
            (cached.list || []).length + " layer";
          STATE.isLoading = false;
          return;
        }

        document.getElementById("list").innerHTML = `
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        `;
        document.getElementById("map-loading").style.display = "block";

        // MAP request
        fetchJSON({ bbox }, "map").then((mapData) => {
          if (requestId !== STATE.mapRequestId) return;
          renderMap(mapData?.features || []);
          updateWMSIfNeeded();
        });

        // LIST request
        fetchJSON({ bbox }, "list")
          .then((listData) => {
            let listFeatures = Array.isArray(listData?.data)
              ? listData.data
              : [];

            buildList(listFeatures, true);

            STATE.listOffset = listFeatures.length;
            STATE.hasMore = listFeatures.length >= STATE.limit;

            document.getElementById("count").innerText =
              listFeatures.length + " layer";

            setCache(cacheKey, {
              map: geoLayer ? geoLayer.toGeoJSON().features : [],
              list: listFeatures,
            });
          })
          .catch((err) => {
            console.error("LOAD ERROR:", err);
            document.getElementById("count").innerText = "Error";
          })
          .finally(() => {
            STATE.isLoading = false;
            document.getElementById("map-loading").style.display = "none";
          });
      }

      /* ========================= EVENTS ========================= */
      document.getElementById("search").oninput = debounce((e) => {
        let newKeyword = e.target.value.toUpperCase().trim();
        if (STATE.keyword === newKeyword) return;
        STATE.keyword = newKeyword;
        STATE.cache.clear();
        pendingUserAction = true;
        loadData();
      }, 300);

      function setSatellite(type, el) {
        if (STATE.satellite === type) return; // FIX #10 — hindari reload jika tidak ada perubahan
        STATE.satellite = type;
        STATE.cache.clear();
        document
          .querySelectorAll("#satellite-filter button")
          .forEach((b) => b.classList.remove("active-filter"));
        el.classList.add("active-filter");
        pendingUserAction = true;
        loadData();
      }

      let lastCenter = null;
      let lastZoom = null;

      map.on(
        "moveend",
        debounce(() => {
          let center = map.getCenter();
          let zoom = map.getZoom();

          if (zoom < 5) return;

          if (
            lastCenter &&
            center.distanceTo(lastCenter) < 50000 &&
            zoom === lastZoom
          ) {
            return;
          }

          lastCenter = center;
          lastZoom = zoom;

          if (pendingUserAction || STATE.isSelectingFeature) {
            pendingUserAction = false;
            return;
          }

          loadData();
        }, 1200),
      );

      // FIX #1 — sync STATE.catalog dengan nilai awal dropdown
      document
        .getElementById("catalog-filter")
        .addEventListener("change", function () {
          STATE.catalog = this.value;
          STATE.cache.clear();
          pendingUserAction = true;
          updateWMSIfNeeded();
          loadData();
        });

      // FIX #2 — province change: cegah double loadData dari moveend
      document
        .getElementById("province-filter")
        .addEventListener("change", async function () {
          STATE.province = this.value;
          STATE.cache.clear();
          pendingUserAction = true;

          await zoomToProvince(this.value);

          // Tunggu animasi selesai, lalu load — moveend sudah diblock oleh pendingUserAction
          setTimeout(() => {
            pendingUserAction = true; // pastikan flag masih aktif setelah timeout
            loadData();
          }, 400);
        });

      // FIX #1 — set active-filter di awal untuk semua kontrol
      document.addEventListener("DOMContentLoaded", () => {
        // Sync catalog state dengan nilai awal dropdown
        STATE.catalog = document.getElementById("catalog-filter").value;
      });

      document
        .querySelector("#satellite-filter button")
        .classList.add("active-filter");

      /* ========================= UTILS ========================= */
      function debounce(fn, delay) {
        let t;
        return (...args) => {
          clearTimeout(t);
          t = setTimeout(() => fn(...args), delay);
        };
      }

      function formatCloud(value) {
        if (
          value === null ||
          value === undefined ||
          value === "" ||
          isNaN(Number(value))
        ) {
          return "—";
        }
        return Math.round(Number(value)) + "%";
      }

      function formatDate(d) {
        if (!d) return "—";
        let x = new Date(d);
        return isNaN(x.getTime()) ? String(d) : x.toISOString().slice(0, 10);
      }

      /* ========================= INIT ========================= */
      loadProvinceList();
      loadData();

      /* ========================= SCROLL PAGINATION ========================= */
      document
        .getElementById("list-wrap")
        .addEventListener("scroll", function () {
          // FIX #6 — guard ketat: isLoading, hasMore, dan pastikan listOffset sudah final
          if (STATE.isLoading || !STATE.hasMore) return;

          if (this.scrollTop + this.clientHeight >= this.scrollHeight - 200) {
            STATE.isLoading = true;

            let requestId = ++STATE.listRequestId;

            let bbox = null;
            if (STATE.useBBoxFilter) {
              let b = map.getBounds();
              bbox = [
                b.getWest().toFixed(4),
                b.getSouth().toFixed(4),
                b.getEast().toFixed(4),
                b.getNorth().toFixed(4),
              ].join(",");
            }

            let bboxKey = bbox ? getBBoxKey(bbox) : "GLOBAL";
            let filterKey = getFilterKey();
            let cacheKey = `${bboxKey}|${filterKey}`;
            let pageKey = `${cacheKey}|page:${STATE.listOffset}`;

            if (STATE.cache.has(pageKey)) {
              let cached = STATE.cache.get(pageKey);
              buildList(cached, false);
              STATE.listOffset += cached.length;
              if (cached.length < STATE.limit) STATE.hasMore = false;
              STATE.isLoading = false;
              return;
            }

            document.getElementById("scroll-loading").style.display = "block";

            fetchJSON({ bbox }, "list")
              .then((d) => {
                if (requestId !== STATE.listRequestId) return;
                if (!d?.data) return;

                let features = d.data;

                setCache(pageKey, features);

                if (features.length === 0) {
                  STATE.hasMore = false;
                  return;
                }

                buildList(features, false);
                STATE.listOffset += features.length;

                if (features.length < STATE.limit) {
                  STATE.hasMore = false;
                }

                document.getElementById("count").innerText =
                  document.getElementById("list").children.length + " layer";
              })
              .catch(() => {
                /* handled by fetchJSON */
              })
              .finally(() => {
                STATE.isLoading = false;
                document.getElementById("scroll-loading").style.display =
                  "none";
              });
          }
        });

      // FIX #7 — cek geoLayer sebelum hide panel, skip jika klik pada leaflet-interactive
      map.on("click", function (e) {
        const target = e.originalEvent.target;
        if (target.closest && target.closest(".leaflet-interactive")) return;
        if (target.closest && (target.closest("#panel") || target.closest("#sidebar"))) return;
        if (document.getElementById("panel").classList.contains("open")) {
          hidePanel();
        }
      });

      /* ========================= HIGHLIGHT ========================= */
      function highlightList(id) {
        document
          .querySelectorAll(".item")
          .forEach((el) => el.classList.remove("active"));
        const el = document.querySelector(`.item[data-id="${id}"]`);
        if (el) {
          el.classList.add("active");
          el.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
      }

      /* ========================= ZOOM PROVINCE ========================= */
      async function zoomToProvince(name) {
        if (name === "ALL") {
          map.flyTo([-2, 118], 5);
          return;
        }
        try {
          const res = await fetch(
            `${CONFIG.apiBase}/province-geom?name=${encodeURIComponent(name)}`,
          );
          const geojson = await res.json();
          if (!geojson.geometry) return;
          const layer = L.geoJSON(geojson);
          map.fitBounds(layer.getBounds(), { padding: [20, 20] });
        } catch (err) {
          console.error("Zoom province error:", err);
        }
      }

      /* ========================= build WMS Layer ========================= */
      function buildWMSLayer() {
        let workspace;
        let layerName;
        let keywordField;

        if (STATE.catalog === "STARVISION") {
          workspace = "catalog";
          layerName = "starvision_catalog";
          keywordField = "layer";
        } else {
          workspace = "catalog";
          layerName = "lasac_catalog";
          keywordField = "filename";
        }

        let cql = [];

        if (STATE.satellite !== "ALL") {
          const safeSat = STATE.satellite.replace(/'/g, "''");
          cql.push(`satellite ILIKE '${safeSat}%'`);
        }

        if (STATE.keyword) {
          const safeKeyword = STATE.keyword.replace(/'/g, "''");
          cql.push(`${keywordField} ILIKE '%${safeKeyword}%'`);
        }

        // FIX #9 — tambah province filter ke WMS CQL jika dipilih
        if (STATE.province !== "ALL") {
          const safeProv = STATE.province.replace(/'/g, "''");
          cql.push(`provinsi = '${safeProv}'`);
        }

        let cqlFilter = cql.length > 0 ? cql.join(" AND ") : "INCLUDE";

        return L.tileLayer.wms(
          "http://localhost:8082/geoserver/" + workspace + "/wms",
          {
            layers: workspace + ":" + layerName,
            format: "image/png",
            transparent: true,
            tiled: true,
            version: "1.1.1",
            opacity: 1,
            CQL_FILTER: cqlFilter,
          },
        );
      }

      /* ========================= update WMS If Needed ========================= */
      function updateWMSIfNeeded() {
        // FIX #9 — cek apakah filter benar-benar berubah sebelum rebuild WMS
        const newFilterKey = getFilterKey();
        if (newFilterKey === STATE.lastFilterKey && wmsLayer) return;

        if (wmsLayer) {
          map.removeLayer(wmsLayer);
          wmsLayer = null;
        }

        const newLayer = buildWMSLayer();
        if (newLayer) {
          wmsLayer = newLayer;
          wmsLayer.addTo(map);
        }

        if (geoLayer) {
          geoLayer.bringToFront();
        }

        STATE.lastFilterKey = newFilterKey;
      }

      /* ========================= getBBoxKey ========================= */
      function getBBoxKey(bbox) {
        return bbox
          .split(",")
          .map((n) => Number(n).toFixed(1))
          .join(",");
      }

      /* ========================= getDynamicLimit ========================= */
      function getDynamicLimit() {
        let zoom = map.getZoom();
        if (zoom <= 5) return 30;
        if (zoom <= 8) return 60;
        return 120;
      }

      /* ========================= setCache ========================= */
      const MAX_CACHE = 20;

      function setCache(key, value) {
        if (STATE.cache.size >= MAX_CACHE) {
          let firstKey = STATE.cache.keys().next().value;
          STATE.cache.delete(firstKey);
        }
        STATE.cache.set(key, value);
      }

      /* ========================= highlightText ========================= */
      function highlightText(text) {
        // FIX #5 — pastikan text selalu string sebelum diproses
        const safeInput = text != null ? String(text) : "";
        if (!STATE.keyword) return escapeHTML(safeInput);
        let safeText = escapeHTML(safeInput);
        let escaped = STATE.keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        let regex = new RegExp(`(${escaped})`, "gi");
        return safeText.replace(
          regex,
          `<span style="color:var(--brin-red);font-weight:700">$1</span>`,
        );
      }

      function escapeHTML(str) {
        if (!str) return "";
        return String(str).replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[m],
        );
      }
    </script>
  </body>
</html>
